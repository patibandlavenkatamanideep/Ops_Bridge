[alembic]
script_location = %(here)s/src/opsbridge/persistence/migrations
prepend_sys_path = src
# Connection URL is built in env.py from OPSBRIDGE_* settings (migrator role).
# Override the database with: alembic -x db=opsbridge_test upgrade head

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
