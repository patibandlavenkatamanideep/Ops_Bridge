  receipts:
  - id: GR-6402A
    date: '2026-10-21'
    lines:
    - {line: 1, qty: '8', unit: EA, kind: receipt, status: accepted}
  invoice:
    number: INV-8402
    date: '2026-10-28'
    supplier_id: SUP-ACME
    supplier_name: Acme Office Furniture Inc
    po_number: PO-4002
    currency: USD
    lines:
    - {line: 1, po_line: 1, item: DK-410, desc: Height-adjustable desk, qty: '10', unit: EA,
       price: '410.00', kind: goods}
  allocations: []
  messages: []
  expected:
