# Synthetic pilot rehearsal cases (docs/pilot/quickstart.md). No benchmark or canary reads
# this file, and nothing here comes from a customer. `split: dev` is the scenario format's
# development label; the format's renderer is bound by digest to the frozen benchmarks, so it
# is not changed for a label. Labels are written by hand from
# packs/furniture/policies/furniture-ap-v2.yaml. Organization: demo-furniture.
schema_version: 1
corpus_id: opsbridge-pilot-rehearsal-v1
scenarios:
- id: pilot-a
  pack: furniture
  family: PILOT-DELIVERED-NOT-ACCEPTED
  template: acme-pdf-v1
  split: dev
  description: 'Scenario A: 20 chairs billed; receiving accepted 18 and rejected 2 as damaged; the
    supplier says all 20 were delivered.'
  supplier: {id: SUP-ACME, name: Acme Office Furniture Inc}
  po:
    number: PO-4001
    currency: USD
    date: '2026-10-01'
    lines:
    - {line: 1, item: CH-100, desc: 'Task chair, mesh back', qty: '20', unit: EA, price: '185.00'}
  receipts:
  - id: GR-6401A
    date: '2026-10-20'
    lines:
    - {line: 1, qty: '18', unit: EA, kind: receipt, status: accepted}
    - {line: 1, qty: '2', unit: EA, kind: receipt, status: rejected}
  invoice:
    number: INV-8401
    date: '2026-10-28'
    supplier_id: SUP-ACME
    supplier_name: Acme Office Furniture Inc
    po_number: PO-4001
    currency: USD
    lines:
    - {line: 1, po_line: 1, item: CH-100, desc: 'Task chair, mesh back', qty: '20', unit: EA,
       price: '185.00', kind: goods}
  allocations: []
  messages:
  - id: MSG-P4010
    text: "Hello AP team,\nWe delivered all 20 chairs for PO-4001 on 20 October. Please pay the\
      \ full invoice.\nRegards, Acme billing"
  # Relabelled for rules 1.4.0 (docs/receiving-disposition.md): the receipt rejects 2 chairs
  # without a reason (this format has no column for one), so receiving is asked for the
  # inspection record before the supplier is asked for a remedy. Under rules 1.3.0 the label
  # was discrepancies_found, quantity_mismatch, propose_action:create_follow_up_task.
  expected:
    outcome: needs_information
    types: []
    next_action: request_information:create_follow_up_task
    note: 20 arrived, 18 count; the 2 rejected chairs are billed and their rejection has no reason
