# Synthetic receiving and disposition cases (docs/receiving-disposition.md). Nothing here comes
# from a customer, and no benchmark or canary reads this file. Each case is a scenario in the
# frozen scenario format plus receiving records with rejection reasons and receiving events
# (backend/src/opsbridge/pilot/receiving_pack.py). The `expected` labels were written by hand
# from packs/furniture/policies/furniture-ap-v2.yaml, the demo tenant's policy, before the
# rules were run on them; that policy names no owner for rejected goods. Organization:
# demo-furniture.
schema_version: 1
corpus_id: opsbridge-receiving-disposition-v1
cases:
- id: rcv-a-short-delivery
