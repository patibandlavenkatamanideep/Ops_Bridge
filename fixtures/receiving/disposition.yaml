    template: acme-pdf-v1
    split: dev
    description: 20 ordered and billed; 18 delivered and accepted.
    supplier:
      id: SUP-ACME
      name: Acme Office Furniture Inc
    po:
      number: PO-4601
      currency: USD
      date: '2026-10-01'
      lines:
      - line: 1
        item: CH-100
        desc: Task chair, mesh back
        qty: '20'
        unit: EA
        price: '185.00'
    invoice:
      number: INV-8601
      date: '2026-10-28'
