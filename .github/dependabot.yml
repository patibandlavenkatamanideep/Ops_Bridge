# Proposed dependency updates arrive as pull requests for review; nothing updates itself.
# Every update still has to pass CI, including the image scan.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /infra/containers
    schedule: { interval: weekly }
    ignore:
      # backend/pyproject.toml requires Python 3.12 (requires-python <3.13), so only 3.12
      # patch images can work; moving to a newer Python is a deliberate change of its own.
      - dependency-name: library/python
        update-types: [version-update:semver-major, version-update:semver-minor]
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5
