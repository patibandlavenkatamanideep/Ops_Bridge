# OpsBridge release (production review A12). Prepared, not yet used: it runs only when the
# owner pushes a version tag (v1.2.3) or starts it by hand. It publishes the exact image CI
# qualified, never a fresh variant: it refuses a commit whose required CI checks did not all
# succeed, builds from the locks, pushes to GitHub Container Registry, attaches an SBOM and a
# build-provenance attestation, and verifies the attestation before finishing. Deployments
# promote the digest it prints, not the tag. Actions are pinned to commits.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opsbridge

jobs:
  release:
    name: build, attest and verify the release image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read # to confirm CI qualified this commit
      packages: write # push the image
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a commit CI did not qualify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          required=(
            "lint, types, unit, canary, receipts, build"
            "integration (PostgreSQL, Keycloak, MCP) and alert rules"
            "browser tests against the dev stack"
            "runtime image (build, smoke test, SBOM, vulnerability scan)"
          )
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --paginate \
            --jq '.check_runs[] | "\(.name)\t\(.conclusion)"')
          for name in "${required[@]}"; do
            if ! grep -qxF "${name}"$'\t'"success" <<<"${runs}"; then
              echo "::error::CI check '${name}' did not succeed for ${SHA}; not releasing"
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build from the locks and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/containers/opsbridge.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: opsbridge-${{ github.ref_name }}.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify the attestation before calling it released
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
          echo "Released ${IMAGE}@${DIGEST} from ${GITHUB_SHA}; promote this digest." >> "${GITHUB_STEP_SUMMARY}"
