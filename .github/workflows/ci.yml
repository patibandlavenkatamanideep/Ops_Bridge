# OpsBridge CI. Runs on pull requests to main, on every push to main (so the exact merge
# commit is qualified, not only the PR head) and on manual dispatch. No secrets are used:
# setup generates a throwaway .env; no paid model, GitHub-sandbox or customer calls are
# possible (live tests never run without OPSBRIDGE_RUN_LIVE, which is not set). Actions are
# pinned to commits. Nothing is published: the image is built, tested and scanned only.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main is qualified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.10.2"
  NODE_VERSION: "24.22.0"

jobs:
  checks:
    name: lint, types, unit, canary, receipts, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - name: Generated API types match the backend
        run: make openapi && git diff --exit-code -- frontend/src/api
      - run: make lint
      - run: make typecheck
      - name: Install tesseract for the OCR tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr && tesseract --version
      - run: make test
        env:
          OPSBRIDGE_REQUIRE_OCR: "1" # the real-engine OCR test must run, not skip
      - run: make eval-canary
      - name: Verify sealed evaluation receipts
        run: uv --directory backend run --frozen python -m opsbridge.cli eval-verify
      - run: make build

  integration:
    name: integration (PostgreSQL, Keycloak, MCP) and alert rules
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make infra-up
      - run: make migrate
      - run: make alerts-test
      - run: make test-integration
      - name: Benchmark replay reproduces the recorded runs (offline, seals nothing)
        run: make eval-replay-check

  e2e:
    name: browser tests against the dev stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make infra-up
      - run: make migrate
      - run: make seed-demo
      - name: Install tesseract for the OCR browser test
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr && tesseract --version
      - name: Start the dev stack
        run: |
          # the environment `make setup` created (the Makefile exports the same variable)
          export UV_PROJECT_ENVIRONMENT=.venv.nosync
          export OPSBRIDGE_OCR_ENABLED=true
          nohup uv --directory backend run --frozen python ../scripts/devstack.py > devstack.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 2
          done
          cat devstack.log; exit 1
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make test-e2e
        env:
          OPSBRIDGE_REQUIRE_OCR: "1"
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            devstack.log
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: runtime image (build, smoke test, SBOM, vulnerability scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the runtime image from the locks
        run: docker build -f infra/containers/opsbridge.Dockerfile -t opsbridge/app:ci .
      - name: Smoke test the image (non-root, CLI, API health)
        run: |
          test "$(docker run --rm opsbridge/app:ci id -u)" = 10001
          docker run --rm opsbridge/app:ci python -m opsbridge.cli --help > /dev/null
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e OPSBRIDGE_SESSION_SECRET="$(openssl rand -hex 32)" opsbridge/app:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: opsbridge/app:ci
          format: spdx-json
          artifact-name: opsbridge-image.spdx.json
      - name: Fail on critical vulnerabilities that have a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsbridge/app:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
