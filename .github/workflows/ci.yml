# OpsBridge CI. Runs on pull requests to main, on every push to main (so the exact merge
# commit is qualified, not only the PR head) and on manual dispatch. No secrets are used:
# setup generates a throwaway .env; no paid model, GitHub-sandbox or customer calls are
# possible (live tests never run without OPSBRIDGE_RUN_LIVE, which is not set). Actions are
# pinned to commits. Nothing is published: the image is built, tested and scanned only.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main is qualified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.10.2"
  NODE_VERSION: "24.22.0"

jobs:
  checks:
    name: lint, types, unit, canary, receipts, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - name: Generated API types match the backend
        run: make openapi && git diff --exit-code -- frontend/src/api
      - run: make lint
      - run: make typecheck
      - name: Install tesseract for the OCR tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr && tesseract --version
      - run: make test
        env:
          OPSBRIDGE_REQUIRE_OCR: "1" # the real-engine OCR test must run, not skip
          OPSBRIDGE_REQUIRE_SANDBOX: "1" # and the confined-parser tests (Landlock) too
      - run: make eval-canary
      - name: Verify sealed evaluation receipts
        run: uv --directory backend run --frozen python -m opsbridge.cli eval-verify
      - run: make build

  integration:
    name: integration (PostgreSQL, Keycloak, MCP) and alert rules
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make infra-up
      - run: make migrate
      - run: make alerts-test
      - run: make test-integration
      - name: Benchmark replay reproduces the recorded runs (offline, seals nothing)
        run: make eval-replay-check

  e2e:
    name: browser tests against the dev stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make infra-up
      - run: make migrate
      - run: make seed-demo
      - name: Install tesseract for the OCR browser test
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr && tesseract --version
      - name: Start the dev stack
        run: |
          # the environment `make setup` created (the Makefile exports the same variable)
          export UV_PROJECT_ENVIRONMENT=.venv.nosync
          export OPSBRIDGE_OCR_ENABLED=true
          nohup uv --directory backend run --frozen python ../scripts/devstack.py > devstack.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 2
          done
          cat devstack.log; exit 1
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make test-e2e
        env:
          OPSBRIDGE_REQUIRE_OCR: "1"
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            devstack.log
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: runtime image (build, smoke test, SBOM, vulnerability scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the runtime image from the locks
        run: docker build -f infra/containers/opsbridge.Dockerfile -t opsbridge/app:ci .
      - name: Smoke test the image (non-root, CLI, API health)
        run: |
          test "$(docker run --rm opsbridge/app:ci id -u)" = 10001
          docker run --rm opsbridge/app:ci python -m opsbridge.cli --help > /dev/null
          # The image carries evaluation results and the signed ledger, not the evidence
          # bundle (evals/runs): it verifies the ledger, and says full verification is partial.
          docker run --rm opsbridge/app:ci python -m opsbridge.cli eval-verify --summary-only
          status=0; docker run --rm opsbridge/app:ci python -m opsbridge.cli eval-verify || status=$?
          test "$status" = 3
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e OPSBRIDGE_SESSION_SECRET="$(openssl rand -hex 32)" opsbridge/app:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Parser subprocesses are confined in the image (Landlock)
        run: |
          # As compose runs it: read-only root, /tmp tmpfs, no capabilities, Docker's default
          # seccomp profile. A probe confined as the PDF worker is may read no file outside its
          # code and connect to no TCP port (backend/src/opsbridge/evidence/sandbox.py).
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true opsbridge/app:ci \
            python -m opsbridge.cli parser-sandbox-check
      - name: Every volume mount point is writable by the service user
        run: |
          # Docker gives a new volume the owner of the image directory it is mounted on, and
          # root's where the image has none (backend/tests/test_compose_secrets.py).
          for dir in /app/var /app/var/artifacts /app/var/keys /app/var/delegation-public; do
            docker run --rm -v "$dir" opsbridge/app:ci touch "$dir/probe"
          done
      - name: Evidence bundle round trip (the release's steps)
        run: |
          # Built in the image from this checkout's evals/, then verified by an image that has
          # only the ledger: every record's artifacts from the bundle alone (A17).
          mkdir -m 0777 dist
          docker run --rm -v "$PWD/evals:/app/evals:ro" -v "$PWD/dist:/out" opsbridge/app:ci \
            python -m opsbridge.cli eval-bundle --out /out/opsbridge-evidence.tar.gz
          docker run --rm -v "$PWD/dist:/out:ro" opsbridge/app:ci \
            python -m opsbridge.cli eval-verify --bundle /out/opsbridge-evidence.tar.gz
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: opsbridge/app:ci
          format: spdx-json
          artifact-name: opsbridge-image.spdx.json
      # Production review A12: the gate was fixable CRITICAL only. HIGH was measured first (run
      # 41418268617: pypdf, openssl), fixed, and then added to the gate.
      - name: Fail on critical or high vulnerabilities that have a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsbridge/app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml
