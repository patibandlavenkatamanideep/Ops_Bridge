# Local observability profile: scrapes the API and worker running on the host (make dev).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: opsbridge-api
    static_configs: [{targets: ["host.containers.internal:8000"]}]
  - job_name: opsbridge-worker
    static_configs: [{targets: ["host.containers.internal:9101"]}]
